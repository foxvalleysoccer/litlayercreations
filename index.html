<body>
<header>
<img src="Images/Logo.png" alt="Lit Layer Creations Logo" style="max-width: 200px; height: auto; margin-bottom: 10px;">
<h1>Lit Layer Creations</h1>
<p>Custom 3D Printed Light Boxes</p>
</header>
<div id="catalog"></div>

<script>
fetch("catalog.json")
  .then(res => res.json())
  .then(data => {
    const root = document.getElementById("catalog");

    data.forEach(cat => {
      const section = document.createElement("div");
      section.className = "category";
      section.innerHTML = `<h2>${cat.category}</h2>`;

      const grid = document.createElement("div");
      grid.className = "items";

      cat.items.forEach(item => {
        const card = document.createElement("div");
        card.className = "card";

        const media = document.createElement("div");
        media.className = "media";

        const maxVisible = 9;
        const hasMore = item.media.length > maxVisible;

        if (hasMore) {
          media.classList.add('has-more');
        }

        item.media.forEach((src, index) => {
          if (!hasMore && index >= maxVisible) return;

          if (src.endsWith(".mp4")) {
            const v = document.createElement("video");
            v.src = src;
            v.controls = true;
            v.setAttribute("title", `${item.name} LED light box – Lit Layer Creations`);
            media.appendChild(v);
          } else {
            const img = document.createElement("img");
            img.src = src;
            img.alt = `${item.name} LED light box – custom 3D printed – Lit Layer Creations`;
            img.onclick = () => window.open(src, "_blank");
            media.appendChild(img);
          }
        });

        card.innerHTML = `
          <h3>${item.name}</h3>
          <p>${item.description || 'Custom 3D printed light box.'}</p>
          <p>Sizes: ${item.sizes ? item.sizes.join(', ') : '7-8 inch, 9 inch'}</p>
         
        `;

        card.appendChild(media);

        grid.appendChild(card);
      });

      section.appendChild(grid);
      root.appendChild(section);

      // Add click handler to toggle collapse
      const header = section.querySelector('h2');
      header.addEventListener('click', () => {
        section.classList.toggle('collapsed');
      });
    });
  });
</script>
</body>
